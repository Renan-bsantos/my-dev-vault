<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main R letter -->
  <path d="M 60 40 L 60 160 L 100 160 L 100 120 L 120 120 L 140 100 L 120 80 L 100 80 L 100 40 Z" fill="url(#logoGradient)"/>
  <path d="M 80 100 L 100 100 L 115 85 L 100 70 L 80 70 Z" fill="white" opacity="0.9"/>
  
  <!-- Code brackets -->
  <path d="M 130 60 L 150 80 L 130 100 L 150 120 L 130 140" stroke="url(#logoGradient2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 170 60 L 150 80 L 170 100 L 150 120 L 170 140" stroke="url(#logoGradient2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Decorative dots -->
  <circle cx="140" cy="100" r="4" fill="url(#logoGradient2)"/>
</svg>

